<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Distancia entre dos puntos de una esfera</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#f6f7f4;--panel:#fff;--ink:#16222e;--mute:#5d6b78;--line:#d8dde2;--a:#0b6b83;--b:#b4472f;--grid:#cfd6dc;--sea:#eaf1f4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f171e;--panel:#17222c;--ink:#e6edf2;--mute:#93a3b1;--line:#2a3743;--a:#5cc1d9;--b:#f08a6f;--grid:#2c3a46;--sea:#13202a}}
:root[data-theme="dark"]{--bg:#0f171e;--panel:#17222c;--ink:#e6edf2;--mute:#93a3b1;--line:#2a3743;--a:#5cc1d9;--b:#f08a6f;--grid:#2c3a46;--sea:#13202a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:28px 18px 40px}
h1{font:700 clamp(26px,4vw,38px)/1.15 "Source Serif 4",Georgia,serif;margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 22px;max-width:62ch}
.grid{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
@media(max-width:780px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 3px}
select,input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:7px 9px}
select:focus-visible,input:focus-visible{outline:2px solid var(--a);outline-offset:1px}
fieldset{border:0;border-top:1px solid var(--line);margin:14px 0 0;padding:6px 0 0}
legend{font:700 17px "Source Serif 4",Georgia,serif;padding:0 8px 0 0}
.pa legend{color:var(--a)}.pb legend{color:var(--b)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font:700 clamp(34px,6vw,54px)/1.05 "Source Serif 4",Georgia,serif;margin:2px 0 0}
.big small{font-size:.45em;font-weight:500;color:var(--mute)}
.pts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.pts div{border-left:4px solid;padding-left:10px}
.pts .a{border-color:var(--a)}.pts .b{border-color:var(--b)}
.pts b{display:block;font-family:"Source Serif 4",Georgia,serif}
table{width:100%;border-collapse:collapse;font-size:15px;margin-top:6px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:600}
td.main{font-weight:600}
svg{width:100%;height:auto;display:block;margin-top:14px;border-radius:6px;background:var(--sea)}
.err{color:var(--b);font-weight:600}
.note{color:var(--mute);font-size:14px;margin:10px 0 0}
</style>
</head>
<body>
<div class="wrap">
<h1>Distancia entre dos puntos de una esfera</h1>
<p class="sub">Ingresa las coordenadas de A y B. La demo calcula el ángulo central con funciones trigonométricas y lo multiplica por el radio del planeta.</p>
<div class="grid">
<section class="card" aria-label="Datos de entrada">
<label for="body">Cuerpo celeste</label>
<select id="body"></select>
<label for="pre">Ejemplos</label>
<select id="pre"></select>
<fieldset class="pa"><legend>Punto A</legend><div class="row">
<div><label for="la1">Latitud (°)</label><input id="la1" type="number" step="any" value="4.7110"></div>
<div><label for="lo1">Longitud (°)</label><input id="lo1" type="number" step="any" value="-74.0721"></div></div></fieldset>
<fieldset class="pb"><legend>Punto B</legend><div class="row">
<div><label for="la2">Latitud (°)</label><input id="la2" type="number" step="any" value="40.4168"></div>
<div><label for="lo2">Longitud (°)</label><input id="lo2" type="number" step="any" value="-3.7038"></div></div></fieldset>
</section>
<section class="card" aria-live="polite" id="out"></section>
</div>
</div>
<script>
const BODIES={"Tierra":6371.0088,"Luna":1737.4,"Marte":3389.5,"Venus":6051.8,"Mercurio":2439.7};
const PRE=[["Personalizado"],["Bogotá – Madrid",4.7110,-74.0721,40.4168,-3.7038],["Nueva York – Londres",40.7128,-74.0060,51.5074,-0.1278],["Sídney – Santiago de Chile",-33.8688,151.2093,-33.4489,-70.6693],["Torre Eiffel – Arco del Triunfo",48.8584,2.2945,48.8738,2.2950]];
const $=id=>document.getElementById(id), rad=x=>x*Math.PI/180, deg=x=>x*180/Math.PI;
const fmt=(x,d=3)=>x.toLocaleString("es-CO",{minimumFractionDigits:d,maximumFractionDigits:d}).replace("-","−");
const dg=x=>fmt(x,4)+"°";
// Modelos (radianes)
function cosLaw(p1,l1,p2,l2){const c=Math.sin(p1)*Math.sin(p2)+Math.cos(p1)*Math.cos(p2)*Math.cos(l2-l1);return Math.acos(Math.max(-1,Math.min(1,c)))}
function haversine(p1,l1,p2,l2){const h=Math.sin((p2-p1)/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin((l2-l1)/2)**2;return 2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h))}
function vec(p1,l1,p2,l2){const dl=l2-l1,p=Math.cos(p2)*Math.sin(dl),q=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl),x=Math.sin(p1)*Math.sin(p2)+Math.cos(p1)*Math.cos(p2)*Math.cos(dl);return Math.atan2(Math.hypot(p,q),x)}
function bearing(p1,l1,p2,l2){const dl=l2-l1;return (deg(Math.atan2(Math.sin(dl)*Math.cos(p2),Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl)))+360)%360}
function vincenty(P1,L1,P2,L2){const a=6378137,f=1/298.257223563,b=(1-f)*a,L=L2-L1;
 const U1=Math.atan((1-f)*Math.tan(P1)),U2=Math.atan((1-f)*Math.tan(P2)),sU1=Math.sin(U1),cU1=Math.cos(U1),sU2=Math.sin(U2),cU2=Math.cos(U2);
 let lam=L,ss,cs,sig,c2a,c2sm,ok=false;
 for(let i=0;i<200;i++){const sl=Math.sin(lam),cl=Math.cos(lam);ss=Math.hypot(cU2*sl,cU1*sU2-sU1*cU2*cl);if(ss===0)return 0;
  cs=sU1*sU2+cU1*cU2*cl;sig=Math.atan2(ss,cs);const sa=cU1*cU2*sl/ss;c2a=1-sa*sa;c2sm=c2a?cs-2*sU1*sU2/c2a:0;
  const C=f/16*c2a*(4+f*(4-3*c2a)),lp=lam;lam=L+(1-C)*f*sa*(sig+C*ss*(c2sm+C*cs*(-1+2*c2sm*c2sm)));
  if(Math.abs(lam-lp)<1e-12){ok=true;break}}
 if(!ok)return NaN;
 const u2=c2a*(a*a-b*b)/(b*b),A=1+u2/16384*(4096+u2*(-768+u2*(320-175*u2))),B=u2/1024*(256+u2*(-128+u2*(74-47*u2)));
 const ds=B*ss*(c2sm+B/4*(cs*(-1+2*c2sm*c2sm)-B/6*c2sm*(-3+4*ss*ss)*(-3+4*c2sm*c2sm)));
 return b*A*(sig-ds)/1000}
// Arco de círculo máximo (interpolación esférica)
function arc(p1,l1,p2,l2,n=120){const v=(p,l)=>[Math.cos(p)*Math.cos(l),Math.cos(p)*Math.sin(l),Math.sin(p)],a=v(p1,l1),b=v(p2,l2),w=vec(p1,l1,p2,l2),out=[];
 for(let i=0;i<=n;i++){const t=i/n,s=Math.sin(w)||1,k1=w?Math.sin((1-t)*w)/s:1-t,k2=w?Math.sin(t*w)/s:t,x=k1*a[0]+k2*b[0],y=k1*a[1]+k2*b[1],z=k1*a[2]+k2*b[2];
  out.push([deg(Math.atan2(y,x)),deg(Math.atan2(z,Math.hypot(x,y)))])}return out}
function mapSvg(A,B,pts){let g="";for(let x=0;x<=360;x+=30)g+=`<line x1="${x}" y1="0" x2="${x}" y2="180" stroke="var(--grid)" stroke-width=".4"/>`;
 for(let y=0;y<=180;y+=30)g+=`<line x1="0" y1="${y}" x2="360" y2="${y}" stroke="var(--grid)" stroke-width="${y==90?.9:.4}"/>`;
 let d="",prev=null;for(const [lo,la] of pts){const x=lo+180,y=90-la;d+=(prev===null||Math.abs(lo-prev)>180)?`M${x.toFixed(2)} ${y.toFixed(2)}`:`L${x.toFixed(2)} ${y.toFixed(2)}`;prev=lo}
 const pt=(P,c,t)=>`<circle cx="${P[1]+180}" cy="${90-P[0]}" r="3.2" fill="${c}"/><text x="${P[1]+180+5}" y="${90-P[0]-5}" font-size="9" font-weight="700" fill="${c}" font-family="Source Serif 4,Georgia,serif">${t}</text>`;
 return `<svg viewBox="0 0 360 180" role="img" aria-label="Mapa con el arco de círculo máximo entre A y B">${g}<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="1.4" stroke-linecap="round"/>${pt(A,"var(--a)","A")}${pt(B,"var(--b)","B")}</svg>`}
// Interfaz
function update(){
 const body=$("body").value,R=BODIES[body],v=["la1","lo1","la2","lo2"].map(i=>parseFloat($(i).value)),out=$("out");
 if(v.some(isNaN)||Math.abs(v[0])>90||Math.abs(v[2])>90||Math.abs(v[1])>180||Math.abs(v[3])>180){
  out.innerHTML='<p class="err">Revisa los datos: la latitud va de −90 a 90 y la longitud de −180 a 180.</p>';return}
 const [p1,l1,p2,l2]=v.map(rad),s=haversine(p1,l1,p2,l2),d=R*s,m={cos:R*cosLaw(p1,l1,p2,l2),vec:R*vec(p1,l1,p2,l2)};
 const vin=body==="Tierra"?vincenty(p1,l1,p2,l2):null;
 const vinCell=vin===null?"No aplica":isNaN(vin)?"No converge":fmt(vin);
 const row=(n,x,c)=>`<tr><td${c?' class="main"':""}>${n}</td><td${c?' class="main"':""}>${x===null?"—":fmt(x)}</td></tr>`;
 out.innerHTML=`<div class="note" style="margin:0">Distancia entre A y B en ${body} (haversine)</div>
 <p class="big">${fmt(d)} <small>km</small></p>
 <p class="note" style="margin-top:4px">${fmt(d*0.621371)} mi · ángulo central ${fmt(s,5)} rad (${fmt(deg(s),3)}°) · radio ${fmt(R,4)} km</p>
 <div class="pts"><div class="a"><b>Punto A</b>latitud ${dg(v[0])}<br>longitud ${dg(v[1])}</div><div class="b"><b>Punto B</b>latitud ${dg(v[2])}<br>longitud ${dg(v[3])}</div></div>
 <table><tr><th>Modelo</th><th>Distancia (km)</th></tr>
 ${row("Ley esférica de cosenos",m.cos)}${row("Haversine",d,1)}${row("Vectorial con atan2",m.vec)}
 <tr><td>Elipsoide WGS-84 (Vincenty)</td><td>${vinCell}</td></tr></table>
 <p class="note">Rumbo inicial de A hacia B: ${fmt(bearing(p1,l1,p2,l2),2)}° desde el norte. ${vin!==null&&!isNaN(vin)&&vin>0?"La esfera difiere del elipsoide en "+fmt((d-vin)/vin*100,3)+" %.":""}</p>
 ${mapSvg([v[0],v[1]],[v[2],v[3]],arc(p1,l1,p2,l2))}`}
for(const k in BODIES)$("body").add(new Option(k,k));
PRE.forEach((p,i)=>$("pre").add(new Option(p[0],i)));
$("pre").onchange=e=>{const p=PRE[e.target.value];if(p.length>1)["la1","lo1","la2","lo2"].forEach((id,i)=>$(id).value=p[i+1]);update()};
["body","la1","lo1","la2","lo2"].forEach(id=>$(id).addEventListener("input",()=>{if(id!=="body")$("pre").value=0;update()}));
$("pre").value=1;update();
</script>
</body>
</html>
